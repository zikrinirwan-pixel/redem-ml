<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚠️ SISTEM KRITIS!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #050505;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      padding: 15px;
      text-align: center;
    }

    /* Efek kedip merah darurat saat panik */
    .alarm-bg {
      animation: flashRed 0.3s infinite !important;
    }

    @keyframes flashRed {
      0%, 100% { background-color: #050505; }
      50% { background-color: #550000; }
    }

    #warning-box {
      border: 3px solid #ff0000;
      background-color: rgba(20, 0, 0, 0.95);
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
      animation: shake 0.3s infinite;
      position: relative;
      z-index: 10;
    }

    @keyframes shake {
      0% { transform: translate(2px, 1px) rotate(0deg); }
      25% { transform: translate(-3px, -2px) rotate(-1deg); }
      50% { transform: translate(-2px, 3px) rotate(1deg); }
      75% { transform: translate(3px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }

    h1 { color: #ff2222; font-size: 22px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    p { color: #ffffff; font-size: 13px; margin-bottom: 12px; line-height: 1.4; }

    .device-info {
      background: #000;
      border: 1px dashed #ff4444;
      padding: 8px;
      font-size: 11px;
      color: #ffaa00;
      text-align: left;
      margin-bottom: 12px;
      border-radius: 5px;
    }

    .timer {
      font-size: 28px;
      font-weight: bold;
      color: #ff0000;
      margin: 5px 0;
      text-shadow: 0 0 10px red;
    }

    .progress-container {
      width: 100%;
      background-color: #222;
      border-radius: 6px;
      overflow: hidden;
      margin: 10px 0;
      height: 24px;
      border: 1px solid #ff0000;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff0000, #ff6600);
      transition: width 0.15s;
    }

    /* Kotak Terminal Hacker */
    #terminal {
      background: #000;
      border: 1px solid #00ff00;
      color: #00ff00;
      font-size: 11px;
      height: 90px;
      width: 100%;
      text-align: left;
      padding: 6px;
      overflow: hidden;
      margin-bottom: 15px;
      border-radius: 4px;
      line-height: 1.4;
    }

    button {
      background-color: #ff0000;
      color: white;
      border: 2px solid white;
      padding: 14px;
      font-size: 16px;
      font-weight: 900;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      box-shadow: 0 0 15px #ff0000;
      animation: pulse 0.6s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    /* Popup Palsu Bertumpuk */
    .fake-popup {
      position: fixed;
      background: #eee;
      color: #000;
      border: 2px solid #cc0000;
      border-radius: 6px;
      padding: 10px 15px;
      font-family: sans-serif;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
      z-index: 20;
      max-width: 260px;
    }

    /* Layar Akhir Prank */
    #prank-result {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.2); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .big-text {
      font-family: Impact, Arial Black, sans-serif;
      font-size: 54px;
      font-weight: 900;
      color: #ffdd00;
      text-shadow: 0 0 20px #ff0000, 3px 3px 0px #000;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .emoji {
      font-size: 110px;
      margin: 10px 0;
      filter: drop-shadow(0 0 15px rgba(255,255,255,0.4));
    }
  </style>
</head>
<body id="main-body">

  <!-- Layar Simulasi Virus -->
  <div id="warning-box">
    <h1>⚠️ TROJAN-OS TERDETEKSI!</h1>
    <p>Sistem keamanan HP Anda telah diambil alih. Jangan tutup halaman ini atau memformat paksa akan dimulai!</p>
    
    <div class="device-info" id="device-info">
      Mendeteksi perangkat...
    </div>

    <div class="timer" id="countdown">00:10</div>

    <div class="progress-container">
      <div class="progress-bar" id="bar"></div>
    </div>
    
    <div id="terminal">
      > Menginisialisasi root exploit...<br>
    </div>
    
    <button id="stop-btn" onclick="panicMode()">BATALKAN PENGHAPUSAN!</button>
  </div>

  <!-- Layar Kejutan Prank -->
  <div id="prank-result">
    <div class="emoji">🖕</div>
    <div class="big-text">ANK BASONG</div>
    <p style="font-family: sans-serif; font-size: 18px; color: white; font-weight: bold;">
      Muka lu tegang amat bos! 🤣
    </p>
    <p style="color: #888; font-family: sans-serif; font-size: 13px; margin-top: 25px;">
      (Aman bos, cuma web prank doang!)
    </p>
  </div>

  <script>
    let progress = 0;
    let timeLeft = 10;
    let isPanic = false;
    let audioCtx = null;
    let alarmInterval = null;

    const bar = document.getElementById('bar');
    const terminal = document.getElementById('terminal');
    const countdownEl = document.getElementById('countdown');
    const stopBtn = document.getElementById('stop-btn');

    // Tampilkan informasi perangkat asli biar makin yakin
    const ua = navigator.userAgent;
    let deviceName = "Smartphone Android/iOS";
    if (ua.includes("Android")) {
      const match = ua.match(/Android\s([0-9\.]+);\s([^;]+)\sBuild/);
      deviceName = match ? `Android ${match[1]} (${match[2]})` : "Perangkat Android";
    } else if (ua.includes("iPhone")) {
      deviceName = "Apple iPhone iOS";
    }
    document.getElementById('device-info').innerHTML = 
      `<b>TARGET:</b> ${deviceName}<br><b>IP LOKAL:</b> 192.168.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)} (TERKUNCI)<br><b>STATUS:</b> <span style="color:#ff3333">DIRETAS!</span>`;

    const logs = [
      "> Membobol enkripsi WhatsApp...",
      "> Mengunduh semua foto Galeri...",
      "> Menyalin kontak & nomor darurat...",
      "> Mengakses kamera depan...",
      "> Menghapus file sistem Android/data...",
      "> Mengirim data ke server Rusia...",
      "> Mengunci PIN layar utama...",
      "> Merusak IC Power baterai...",
      "> GAGAL MENGHENTIKAN PROSES!"
    ];

    // Fungsi suara sirene alarm menggunakan Web Audio API (tanpa perlu file MP3)
    function startSiren() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        alarmInterval = setInterval(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Nada tinggi
          osc.frequency.linearRampToValueAtTime(440, audioCtx.currentTime + 0.25); // Nada rendah
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.28);
        }, 300);
      } catch (e) {}
    }

    function stopSiren() {
      if (alarmInterval) clearInterval(alarmInterval);
      if (audioCtx) audioCtx.close();
    }

    // Hitung mundur waktu
    const timerInterval = setInterval(() => {
      timeLeft--;
      if (timeLeft >= 0) {
        countdownEl.innerText = `00:0${timeLeft}`;
      }
    }, 1000);

    // Jalankan loading bar & teks hacker
    const mainInterval = setInterval(() => {
      progress += isPanic ? 8 : 3;
      if (progress >= 100) {
        progress = 100;
        clearInterval(mainInterval);
        clearInterval(timerInterval);
        showFinalPrank();
      }
      bar.style.width = progress + '%';
      
      const randomLog = logs[Math.floor(Math.random() * logs.length)];
      terminal.innerHTML += `${randomLog} (${progress}%)<br>`;
      terminal.scrollTop = terminal.scrollHeight;
    }, 350);

    // Munculkan popup error palsu di layar
    function spawnFakePopup() {
      const pop = document.createElement('div');
      pop.className = 'fake-popup';
      const msgs = [
        "⚠️ Sistem UI Berhenti!",
        "❌ Gagal Membatalkan!",
        "⚠️ Kamera Depan Aktif!",
        "🔥 Suhu CPU Meningkat!",
        "🔒 Memori Internal Dihapus!"
      ];
      pop.innerText = msgs[Math.floor(Math.random() * msgs.length)];
      pop.style.top = Math.floor(Math.random() * 75 + 10) + '%';
      pop.style.left = Math.floor(Math.random() * 40 + 10) + '%';
      document.body.appendChild(pop);
    }

    // Saat korban panik dan menekan tombol!
    function panicMode() {
      if (!isPanic) {
        isPanic = true;
        
        // Paksa layar penuh (Fullscreen) agar tombol navigasi HP hilang
        const elem = document.documentElement;
        if (elem.requestFullscreen) { elem.requestFullscreen().catch(()=>{}); }

        // Nyalakan sirene alarm & efek kedip merah
        startSiren();
        document.getElementById('main-body').classList.add('alarm-bg');

        // Getarkan HP panjang
        if (navigator.vibrate) {
          navigator.vibrate([500, 100, 500, 100, 800, 100, 1000]);
        }

        // Ubah teks tombol jadi makin bikin panik
        stopBtn.innerText = "❌ AKSES DITOLAK! MENGHAPUS PAKSA...";
        stopBtn.style.backgroundColor = "#440000";

        // Munculkan banyak popup error bertubi-tubi
        for (let i = 1; i <= 5; i++) {
          setTimeout(spawnFakePopup, i * 350);
        }
      }
    }

    // Tampilkan hasil prank di akhir
    function showFinalPrank() {
      stopSiren();
      document.getElementById('main-body').classList.remove('alarm-bg');
      
      // Hapus semua popup palsu
      document.querySelectorAll('.fake-popup').forEach(e => e.remove());

      // Bunyi "Tadaaa" singkat & getar penutup
      if (navigator.vibrate) navigator.vibrate(400);

      document.getElementById('warning-box').style.display = 'none';
      document.getElementById('prank-result').style.display = 'flex';
      document.body.style.backgroundColor = '#111';
    }
  </script>

</body>
</html>
